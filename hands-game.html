<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 粒子星云 - 上下分层版</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #canvas { display: block; width: 100vw; height: 100vh; }
        
        /* 状态 UI */
        #ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(255, 105, 180, 1);
            font-family: 'Arial Black', sans-serif;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 15px rgba(255,0,80,0.8);
        }
        
        #status { font-size: 16px; margin-bottom: 8px; letter-spacing: 1px; font-weight: bold; }
        
        .progress-bg {
            width: 240px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #ffcc00, #ffffff);
            box-shadow: 0 0 20px #ff0055;
            transition: width 0.1s linear;
        }

        #webcam { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #ff0055;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; z-index: 99;
        }
    </style>
</head>
<body>

    <div id="loading">正在加载粒子引擎...</div>

    <div id="ui-container">
        <div id="status">等待手势...</div>
        <div class="progress-bg"><div id="progress-fill"></div></div>
    </div>

    <video id="webcam"></video>
    <canvas id="canvas"></canvas>

    <script>
        // ============ 配置参数 ============
        const CONFIG = {
            text: "W1ndys",              
            heartParticles: 5000,      
            ringParticles: 2000,       // 增加装饰粒子
            particleSize: 6.0,         // 保持大颗粒
            heartSize: 16,             // 心形稍微缩小一点点以适配屏幕
            disperseRange: 1200,        
            smoothing: 0.1,           
            colorBase: 0xff0055,       
            colorAlt: 0x00aaff         
        };

        // ============ 全局变量 ============
        let scene, camera, renderer;
        let particleSystem, positions, targetPositions, initialPositions;
        let colors;
        let handsDetector;
        
        let gatherProgress = 0;   
        let targetProgress = 0;   
        
        let handRotation = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let sceneGroup;

        // ============ 1. 辅助函数：发光纹理 ============
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(0.6, 'rgba(255,255,255,0.4)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // ============ 2. 初始化 Three.js ============
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0005);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.z = 750; // 再次拉远相机，以便容纳上下两部分

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            sceneGroup = new THREE.Group();
            scene.add(sceneGroup);

            createParticles();
            window.addEventListener('resize', onResize);
        }

        // ============ 3. 创建粒子系统 ============
        function createParticles() {
            const totalParticles = CONFIG.heartParticles + CONFIG.ringParticles;
            
            const geometry = new THREE.BufferGeometry();
            positions = new Float32Array(totalParticles * 3);         
            targetPositions = new Float32Array(totalParticles * 3);   
            initialPositions = new Float32Array(totalParticles * 3);  
            colors = new Float32Array(totalParticles * 3);            

            const color1 = new THREE.Color(CONFIG.colorBase);
            const color2 = new THREE.Color(CONFIG.colorAlt);

            const targets = calculateShapeTargets();

            for (let i = 0; i < totalParticles; i++) {
                // 初始随机位置
                const ix = (Math.random() - 0.5) * CONFIG.disperseRange * 2;
                const iy = (Math.random() - 0.5) * CONFIG.disperseRange * 1.5;
                const iz = (Math.random() - 0.5) * CONFIG.disperseRange;

                initialPositions[i*3] = ix;
                initialPositions[i*3+1] = iy;
                initialPositions[i*3+2] = iz;

                positions[i*3] = ix;
                positions[i*3+1] = iy;
                positions[i*3+2] = iz;

                if (i < targets.length) {
                    targetPositions[i*3] = targets[i].x;
                    targetPositions[i*3+1] = targets[i].y;
                    targetPositions[i*3+2] = targets[i].z;
                } else {
                    targetPositions[i*3] = ix * 1.2; 
                    targetPositions[i*3+1] = iy * 1.2;
                    targetPositions[i*3+2] = iz * 1.2;
                }

                const mixRatio = Math.random() * 0.4;
                const mixedColor = color1.clone().lerp(color2, mixRatio);
                colors[i*3] = mixedColor.r;
                colors[i*3+1] = mixedColor.g;
                colors[i*3+2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: CONFIG.particleSize,
                map: createGlowTexture(),
                vertexColors: true,     
                blending: THREE.AdditiveBlending, 
                depthWrite: false,      
                transparent: true,
                opacity: 1.0 
            });

            particleSystem = new THREE.Points(geometry, material);
            sceneGroup.add(particleSystem);
        }

        // ============ 4. 计算形状目标点 (核心修改：上下分离) ============
        function calculateShapeTargets() {
            let points = [];
            
            // --- A. 文字生成 (位于下方) ---
            const canvasWidth = 1024; 
            const canvasHeight = 256; // 稍微改矮一点，因为只有一行字
            const canvas = document.createElement('canvas');
            canvas.width = canvasWidth; 
            canvas.height = canvasHeight; 
            const ctx = canvas.getContext('2d');
            
            ctx.font = '900 240px Arial Black'; 
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(CONFIG.text, canvasWidth/2, canvasHeight/2);
            
            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight).data;
            const textScale = 1.2; 
            const step = 6; 
            
            // 下移偏移量
            const textYOffset = -220; 

            for(let y=0; y < canvasHeight; y += step) {
                for(let x=0; x < canvasWidth; x += step) {
                    if(imgData[(y * canvasWidth + x) * 4 + 3] > 128) {
                        points.push({
                            x: (x - canvasWidth/2) * textScale,
                            y: -(y - canvasHeight/2) * textScale + textYOffset, // 关键：加上负偏移
                            z: 0
                        });
                    }
                }
            }

            // --- B. 心形生成 (位于上方) ---
            const totalMax = CONFIG.heartParticles + CONFIG.ringParticles;
            const remainingCount = Math.max(0, totalMax - points.length);
            
            // 上移偏移量
            const heartYOffset = 150;

            for(let i=0; i < remainingCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()); 
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                
                points.push({
                    x: x * CONFIG.heartSize * r,
                    y: (y * CONFIG.heartSize * r) + heartYOffset, // 关键：加上正偏移
                    z: (Math.random() - 0.5) * 150 
                });
            }
            
            return points;
        }

        // ============ 5. MediaPipe 手势识别 ============
        async function initHandDetection() {
            const video = document.getElementById('webcam');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                handsDetector = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                handsDetector.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.5
                });

                handsDetector.onResults(onHandResults);

                const cam = new Camera(video, {
                    onFrame: async () => { await handsDetector.send({ image: video }); },
                    width: 640, height: 480
                });
                
                await cam.start();
                document.getElementById('loading').style.display = 'none';
                updateStatus('系统就绪');
                
            } catch (error) {
                console.error(error);
                document.getElementById('loading').textContent = '摄像头访问失败';
            }
        }

        function calculateFistLevel(landmarks) {
            const wrist = landmarks[0];
            const fingers = [
                {tip: 8, pip: 6}, 
                {tip: 12, pip: 10}, 
                {tip: 16, pip: 14}, 
                {tip: 20, pip: 18}
            ];

            let foldedScore = 0;
            fingers.forEach(finger => {
                const tip = landmarks[finger.tip];
                const pip = landmarks[finger.pip];
                const dTip = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                const dPip = Math.hypot(pip.x - wrist.x, pip.y - wrist.y);
                if (dTip < dPip) foldedScore += 1.0;
                else {
                    const ratio = dTip / dPip;
                    if (ratio < 1.3) foldedScore += (1.3 - ratio) * 3;
                }
            });

            const thumbTip = landmarks[4];
            const thumbIp = landmarks[3];
            const thumbBase = landmarks[2];
            const dThumbTip = Math.hypot(thumbTip.x - thumbBase.x, thumbTip.y - thumbBase.y);
            const dThumbIp = Math.hypot(thumbIp.x - thumbBase.x, thumbIp.y - thumbBase.y);
            if (dThumbTip < dThumbIp) foldedScore += 1.0;

            let level = foldedScore / 5.0;
            if (level > 0.7) level = 1.0; 
            return Math.min(Math.max(level, 0), 1);
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const fistLevel = calculateFistLevel(lm);
                targetProgress = fistLevel; 
                
                const centerX = (lm[0].x + lm[9].x) / 2;
                const centerY = (lm[0].y + lm[9].y) / 2;
                targetRotation.y = (centerX - 0.5) * 3.0; 
                targetRotation.x = (centerY - 0.5) * 2.0; 

                const pct = Math.round(fistLevel * 100);
                if(fistLevel >= 0.95) updateStatus(`能量聚合 (MAX)`);
                else if(fistLevel < 0.1) updateStatus(`能量耗散 (0%)`);
                else updateStatus(`充能中... ${pct}%`);

            } else {
                targetProgress = 0; 
                targetRotation.x = 0;
                targetRotation.y = 0;
                updateStatus('请展示手势（握拳）');
            }
        }

        function updateStatus(txt) { document.getElementById('status').innerText = txt; }

        // ============ 6. 动画主循环 ============
        function animate() {
            requestAnimationFrame(animate);

            gatherProgress += (targetProgress - gatherProgress) * CONFIG.smoothing;
            document.getElementById('progress-fill').style.width = (gatherProgress * 100) + '%';
            
            handRotation.x += (targetRotation.x - handRotation.x) * 0.1;
            handRotation.y += (targetRotation.y - handRotation.y) * 0.1;
            sceneGroup.rotation.x = handRotation.x;
            sceneGroup.rotation.y = handRotation.y;
            
            const positionsArray = particleSystem.geometry.attributes.position.array;
            const time = Date.now() * 0.001; 

            for (let i = 0; i < positionsArray.length; i += 3) {
                const tx = targetPositions[i];
                const ty = targetPositions[i+1];
                const tz = targetPositions[i+2];

                const ix = initialPositions[i];
                const iy = initialPositions[i+1];
                const iz = initialPositions[i+2];
                
                const wanderX = Math.sin(time + ix * 0.01) * 25;
                const wanderY = Math.cos(time + iy * 0.01) * 25;
                const wanderZ = Math.sin(time + iz * 0.01) * 25;

                positionsArray[i]   = (ix + wanderX) + (tx - (ix + wanderX)) * gatherProgress;
                positionsArray[i+1] = (iy + wanderY) + (ty - (iy + wanderY)) * gatherProgress;
                positionsArray[i+2] = (iz + wanderZ) + (tz - (iz + wanderZ)) * gatherProgress;
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initThree();
        initHandDetection();
        animate();

    </script>
</body>
</html>
